#cloud-config

packages:
  - curl
  - ca-certificates
  - apt-transport-https
  - containerd
  - sshfs
  - open-iscsi
  - nfs-common

write_files:
  - path: /etc/modules-load.d/k8s.conf
    permissions: '0644'
    content: |
      overlay
      br_netfilter
  - path: /etc/sysctl.d/kubernetes.conf
    permissions: '0644'
    content: |
      net.ipv4.ip_forward = 1
      net.bridge.bridge-nf-call-iptables  = 1
      net.bridge.bridge-nf-call-ip6tables = 1
  - path: /etc/kubernetes/kubeadm-config.yaml
    permissions: '0644'
    content: |
      apiVersion: kubeadm.k8s.io/v1beta4
      kind: InitConfiguration
      nodeRegistration:
        criSocket: unix:///run/containerd/containerd.sock
      ---
      apiVersion: kubeadm.k8s.io/v1beta4
      kind: ClusterConfiguration
      networking:
        podSubnet: "10.244.0.0/16"
      

runcmd:
  - echo '=== Load Kubernetes kernel modules ==='
  - modprobe overlay
  - modprobe br_netfilter
  - sysctl --system

  - echo '=== Configure containerd ==='
  - mkdir -p /etc/containerd
  - containerd config default > /etc/containerd/config.toml
  - sed -i 's/SystemdCgroup = false/SystemdCgroup = true/' /etc/containerd/config.toml
  - systemctl restart containerd
  - systemctl enable containerd

  - echo '=== Add Kubernetes repository ==='
  - mkdir -p -m 755 /etc/apt/keyrings
  - curl -fsSL https://pkgs.k8s.io/core:/stable:/v1.34/deb/Release.key | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
  - echo 'deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.34/deb/ /' > /etc/apt/sources.list.d/kubernetes.list
  - apt-get update
  - echo '=== Configure iscsid for storaging ==='
  - systemctl enable --now iscsid

  - echo '=== Install Kubernetes components ==='
  - apt-get install -y kubeadm kubelet kubectl
  - apt-mark hold kubeadm kubelet kubectl
  - systemctl enable kubelet
  - sysctl --system